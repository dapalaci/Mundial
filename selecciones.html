<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mundial 26 — Selecciones</title>
<link rel="stylesheet" href="assets/shared.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ───── Page hero ───── */
  .sel-hero {
    --hero-pb: 80px;
    --hero-grad-x: 20%; --hero-grad-y: 30%;
    --hero-grad-opacity: 16%; --hero-grad-w: 800px;
    --hero-h1-max: 148px;
  }
  .sel-hero::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 600px 300px at 85% 70%, color-mix(in oklch, var(--accent) 10%, transparent), transparent 70%);
    pointer-events: none;
  }
  .sel-hero-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 80px;
    align-items: end;
  }
  .sel-hero h1 { max-width: none; margin: 24px 0 0; }
  .sel-hero .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 28px 40px;
    padding-bottom: 16px;
  }
  .sel-hero .stat .n {
    font-family: var(--f-display);
    font-size: 52px;
    line-height: 1;
    letter-spacing: -0.03em;
    font-variation-settings: "opsz" 144;
  }
  .sel-hero .stat .n em { color: var(--accent); font-style: italic; }
  .sel-hero .stat .l {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 10px;
  }

  /* ───── Toolbar / filters ───── */
  .toolbar {
    position: sticky;
    top: 68px;
    z-index: 20;
    background: color-mix(in oklch, var(--bg) 80%, transparent);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 14px 0;
  }
  .toolbar-inner {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .search {
    flex: 0 0 260px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-family: var(--f-mono);
    font-size: 12px;
    color: var(--text);
  }
  .search svg { width: 14px; height: 14px; color: var(--text-dim); }
  .search input {
    flex: 1;
    background: transparent;
    border: 0;
    color: var(--text);
    outline: none;
    font-family: inherit;
    font-size: inherit;
  }
  .search input::placeholder { color: var(--text-faint); letter-spacing: 0.1em; }
  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .filter-group {
    display: flex;
    gap: 2px;
    padding: 4px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  .filter-group .lbl {
    padding: 6px 12px;
    font-family: var(--f-mono);
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .filter-group button {
    padding: 6px 14px;
    border-radius: 999px;
    border: 0;
    background: transparent;
    color: var(--text-dim);
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    transition: all .15s;
  }
  .filter-group button:hover { color: var(--text); }
  .filter-group button.active {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .sort-toggle {
    margin-left: auto;
    display: flex;
    gap: 2px;
    padding: 4px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  .sort-toggle button {
    padding: 6px 12px;
    border-radius: 999px;
    border: 0;
    background: transparent;
    color: var(--text-dim);
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    transition: all .15s;
  }
  .sort-toggle button.active { background: var(--accent); color: var(--accent-ink); }

  /* ───── Group bar ───── */
  .group-bar {
    display: flex;
    gap: 6px;
    margin: 28px 0 16px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 8px;
  }
  .group-bar::-webkit-scrollbar { display: none; }
  .group-bar button {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text-dim);
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    white-space: nowrap;
    transition: all .15s;
  }
  .group-bar button:hover { color: var(--text); border-color: var(--line-strong); }
  .group-bar button.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: transparent;
  }
  .group-bar button .n {
    display: inline-block;
    margin-left: 6px;
    opacity: 0.6;
    font-size: 10px;
  }

  /* ───── Results meta ───── */
  .results-meta {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 32px 0 20px;
  }
  .results-meta .count {
    font-family: var(--f-display);
    font-size: 28px;
    letter-spacing: -0.02em;
  }
  .results-meta .count em { color: var(--accent); font-style: italic; }
  .results-meta .tag {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* ───── Grid ───── */
  .team-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  @media (max-width: 1100px) {
    .team-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 800px) {
    .team-grid { grid-template-columns: repeat(2, 1fr); }
    .sel-hero-grid { grid-template-columns: 1fr; gap: 40px; }
  }
  .team-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    cursor: pointer;
    transition: all .2s;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 240px;
  }
  .team-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--team-c1, transparent), transparent 60%);
    opacity: 0.15;
    pointer-events: none;
    transition: opacity .2s;
  }
  /* A: Grain overlay on hero */
  .page-hero::after {
    content: "";
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    mix-blend-mode: overlay;
    opacity: 0.18;
  }

  /* C+H: Glowing team card hover */
  .team-card:hover {
    border-color: color-mix(in oklch, var(--accent) 55%, transparent);
    transform: translateY(-3px);
    box-shadow:
      0 0 0 1px color-mix(in oklch, var(--accent) 22%, transparent),
      0 0 28px color-mix(in oklch, var(--accent) 16%, transparent),
      0 12px 36px rgba(0, 0, 0, 0.5);
  }
  .team-card:hover::before { opacity: 0.25; }
  .team-card.qualified-no {
    opacity: 0.55;
  }
  .team-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .team-flag {
    width: 56px;
    height: 40px;
    border-radius: 4px;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .team-status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    border-radius: 999px;
    font-family: var(--f-mono);
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .team-status.q {
    background: color-mix(in oklch, var(--accent) 20%, transparent);
    color: var(--accent);
  }
  .team-status.q::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
  }
  .team-status.h {
    background: rgba(255,255,255,0.08);
    color: var(--text-dim);
  }
  .team-status.p {
    background: rgba(255,255,255,0.04);
    color: var(--text-faint);
  }
  .team-name {
    font-family: var(--f-display);
    font-size: 26px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    font-variation-settings: "opsz" 144;
    margin: 0;
  }
  .team-conf {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-top: 4px;
  }
  .team-stats {
    display: flex;
    justify-content: space-between;
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    gap: 8px;
  }
  .team-stats .s {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .team-stats .s .v {
    font-family: var(--f-display);
    font-size: 20px;
    letter-spacing: -0.02em;
  }
  .team-stats .s .v em { color: var(--accent); font-style: italic; }
  .team-stats .s .k {
    font-family: var(--f-mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .team-rank {
    position: absolute;
    top: 16px;
    right: 16px;
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--text-faint);
  }

  /* ───── Lightbox ───── */
  .lb-scrim {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
    padding: 40px 20px;
  }
  .lb-scrim.open { display: flex; }
  .lb {
    position: relative;
    width: 100%;
    max-width: 980px;
    max-height: 90vh;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 22px;
    overflow: hidden auto;
  }
  .lb-close {
    position: absolute;
    top: 20px; right: 20px;
    z-index: 2;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    color: var(--text);
    border: 1px solid var(--line-strong);
    font-size: 20px;
    display: grid; place-items: center;
    backdrop-filter: blur(8px);
  }
  .lb-close:hover { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .lb-header {
    position: relative;
    padding: 48px 44px 36px;
    background: linear-gradient(135deg, var(--lb-c1, var(--surface-2)), var(--surface) 65%);
    border-bottom: 1px solid var(--line);
  }
  .lb-header::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 500px 200px at 80% 0%, color-mix(in oklch, var(--accent) 20%, transparent), transparent 70%);
    pointer-events: none;
  }
  .lb-header > * { position: relative; }
  .lb-head-row {
    display: flex;
    gap: 28px;
    align-items: center;
  }
  .lb-flag {
    width: 130px; height: 90px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px var(--line-strong);
  }
  .lb-head-meta { flex: 1; }
  .lb-head-meta .chip-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .lb-head-meta h2 {
    font-family: var(--f-display);
    font-size: 56px;
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin: 0;
    font-variation-settings: "opsz" 144;
  }
  .lb-head-meta .sub {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 8px;
  }
  .lb-content {
    padding: 36px 44px 44px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 36px;
  }
  .lb-section h4 {
    font-family: var(--f-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 14px;
  }
  .lb-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px 24px;
  }
  .lb-stat .n {
    font-family: var(--f-display);
    font-size: 36px;
    letter-spacing: -0.025em;
    line-height: 1;
  }
  .lb-stat .n em { color: var(--accent); font-style: italic; }
  .lb-stat .l {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 6px;
  }
  .lb-keyplayers { display: flex; flex-direction: column; gap: 10px; }
  .lb-player {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .lb-player .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), color-mix(in oklch, var(--accent) 50%, black));
    display: grid; place-items: center;
    font-family: var(--f-display);
    font-size: 15px;
    color: var(--accent-ink);
    letter-spacing: -0.02em;
    flex-shrink: 0;
  }
  .lb-player .info { flex: 1; }
  .lb-player .info .nm {
    font-family: var(--f-sans);
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }
  .lb-player .info .rl {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .lb-historia {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .lb-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 13px;
  }
  .lb-row:last-child { border-bottom: 0; }
  .lb-row .k { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); }
  .lb-row .v { font-family: var(--f-display); color: var(--text); letter-spacing: -0.015em; }
  .lb-quote {
    grid-column: 1 / -1;
    padding: 28px;
    background: color-mix(in oklch, var(--accent) 8%, var(--surface-2));
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    font-family: var(--f-display);
    font-size: 22px;
    line-height: 1.35;
    letter-spacing: -0.015em;
    font-style: italic;
  }
  .lb-quote .cite {
    display: block;
    margin-top: 14px;
    font-family: var(--f-mono);
    font-size: 10px;
    font-style: normal;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  @media (max-width: 800px) {
    .lb-content { grid-template-columns: 1fr; }
    .lb-head-row { flex-direction: column; align-items: flex-start; }
  }

  /* ── Team cinematic banner ── */
  .team-banner {
    position: relative;
    height: 130px;
    margin: -20px -20px 0;
    overflow: hidden;
    flex-shrink: 0;
    border-radius: var(--radius) var(--radius) 0 0;
    background: color-mix(in oklch, var(--team-c1, var(--accent)) 22%, #0a0a12);
  }
  .team-banner img {
    width: 100%; height: 100%;
    object-fit: contain;
    padding: 8px 18px;
    filter: saturate(1.05);
  }
  .team-banner-ov {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom,
      color-mix(in oklch, var(--team-c1, var(--accent)) 55%, transparent) 0%,
      var(--surface) 100%);
  }
  /* Lightbox team image */
  .lb-team-banner {
    position: relative;
    height: 200px;
    overflow: hidden;
    flex-shrink: 0;
    background: color-mix(in oklch, var(--lb-c1, var(--accent)) 22%, #0a0a12);
  }
  .lb-team-banner img {
    width: 100%; height: 100%;
    object-fit: contain;
    padding: 12px 28px;
    filter: saturate(1.05);
  }
  .lb-team-banner-ov {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 30%, var(--surface) 100%);
  }
</style>
</head>
<body>
<div id="m26-nav-slot"></div>

<!-- Hero -->
<section class="sel-hero page-hero">
  <div class="wrap">
    <span class="eyebrow"
      data-i18n-es="● 48 selecciones · 6 confederaciones · 12 grupos"
      data-i18n-en="● 48 nations · 6 confederations · 12 groups">
      ● 48 selecciones · 6 confederaciones · 12 grupos
    </span>
    <div class="sel-hero-grid">
      <h1 data-i18n-es="Las <em>48</em> que<br>pelearán la copa."
          data-i18n-en="The <em>48</em> who<br>will fight for the cup.">
        Las <em>48</em> que<br>pelearán la copa.
      </h1>
      <div class="stats">
        <div class="stat"><div class="n"><em>32</em></div><div class="l" data-i18n-es="Clasificadas" data-i18n-en="Qualified">Clasificadas</div></div>
        <div class="stat"><div class="n">13</div><div class="l" data-i18n-es="En repechaje" data-i18n-en="In playoffs">En repechaje</div></div>
        <div class="stat"><div class="n">3</div><div class="l" data-i18n-es="Anfitrionas" data-i18n-en="Hosts">Anfitrionas</div></div>
        <div class="stat"><div class="n">104</div><div class="l" data-i18n-es="Partidos totales" data-i18n-en="Total matches">Partidos totales</div></div>
      </div>
    </div>
  </div>
</section>

<!-- Toolbar -->
<div class="toolbar">
  <div class="wrap toolbar-inner">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" placeholder="Buscar selección…" data-i18n-es-attr="placeholder" data-ph-es="Buscar selección…" data-ph-en="Search team…"/>
    </div>
    <div class="filters">
      <div class="filter-group" data-filter="conf">
        <span class="lbl" data-i18n-es="Confederación" data-i18n-en="Confed">Confederación</span>
        <button data-val="all" class="active" data-i18n-es="Todas" data-i18n-en="All">Todas</button>
        <button data-val="UEFA">UEFA</button>
        <button data-val="CONMEBOL">CONMEBOL</button>
        <button data-val="CONCACAF">CONCACAF</button>
        <button data-val="AFC">AFC</button>
        <button data-val="CAF">CAF</button>
        <button data-val="OFC">OFC</button>
      </div>
      <div class="filter-group" data-filter="status">
        <span class="lbl" data-i18n-es="Estado" data-i18n-en="Status">Estado</span>
        <button data-val="all" class="active" data-i18n-es="Todos" data-i18n-en="All">Todos</button>
        <button data-val="q" data-i18n-es="Clasificada" data-i18n-en="Qualified">Clasificada</button>
        <button data-val="host" data-i18n-es="Anfitriona" data-i18n-en="Host">Anfitriona</button>
        <button data-val="p" data-i18n-es="Repechaje" data-i18n-en="Playoff">Repechaje</button>
      </div>
    </div>
    <div class="sort-toggle" data-filter="sort">
      <button data-val="rank" class="active" data-i18n-es="Ranking" data-i18n-en="Rank">Ranking</button>
      <button data-val="az" data-i18n-es="A–Z" data-i18n-en="A–Z">A–Z</button>
      <button data-val="cups" data-i18n-es="Títulos" data-i18n-en="Titles">Títulos</button>
    </div>
  </div>
</div>

<main class="wrap section">
  <!-- Group chips -->
  <div class="group-bar" id="group-bar"></div>

  <div class="results-meta">
    <div class="count"><span id="result-n">48</span> <em data-i18n-es="selecciones" data-i18n-en="teams">selecciones</em></div>
    <div class="tag" id="result-tag" data-i18n-es="Ordenadas por ranking FIFA" data-i18n-en="Sorted by FIFA ranking">Ordenadas por ranking FIFA</div>
  </div>

  <!-- Grid -->
  <div class="team-grid" id="team-grid"></div>
</main>

let filter = { conf: "all", status: "all", group: "all", sort: "rank", q: "" };

/* ── Render ── */
const $ = (s, p=document) => p.querySelector(s);
const $$ = (s, p=document) => [...p.querySelectorAll(s)];

function statusLabel(s, lang) {
  if (s === "q") return lang === "en" ? "Qualified" : "Clasificada";
  if (s === "host") return lang === "en" ? "Host" : "Anfitriona";
  return lang === "en" ? "Playoff" : "Repechaje";
}

function applyFilters() {
  const lang = M26.getLang();
  let list = TEAMS.filter(t => {
    if (filter.conf !== "all" && t.conf !== filter.conf) return false;
    if (filter.status !== "all") {
      if (filter.status === "q"    && t.st !== "q")    return false;
      if (filter.status === "host" && t.st !== "host") return false;
      if (filter.status === "p"    && t.st !== "p")    return false;
    }
    if (filter.group !== "all" && t.group !== filter.group) return false;
    if (filter.q) {
      const q = filter.q.toLowerCase();
      if (!t.name.toLowerCase().includes(q) && !t.en.toLowerCase().includes(q) && !t.conf.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  if (filter.sort === "rank")  list.sort((a,b) => a.rank - b.rank);
  if (filter.sort === "az")    list.sort((a,b) => (lang==="en"?a.en:a.name).localeCompare(lang==="en"?b.en:b.name));
  if (filter.sort === "cups")  list.sort((a,b) => b.cups - a.cups || a.rank - b.rank);

  const grid = $("#team-grid");
  grid.innerHTML = list.map((t, i) => {
    const tImg = TEAM_IMGS[t.flag];
    return `
    <article class="team-card qualified-${t.st==="p"?"no":"yes"}" data-idx="${TEAMS.indexOf(t)}" style="--team-c1:${t.c1}">
      ${tImg ? '<div class="team-banner"><img src="' + tImg + '" alt="" loading="lazy" onerror="this.parentElement.style.display=\'none\'"><div class="team-banner-ov"></div></div>' : ''}
      <div class="team-rank">#${t.rank}</div>
      <div class="team-top">
        <div class="team-flag ph flag flag-${t.flag}"></div>
        <span class="team-status ${t.st}">${statusLabel(t.st, lang)}</span>
      </div>
      <div>
        <h3 class="team-name">${lang==="en"?t.en:t.name}</h3>
        <div class="team-conf">${t.conf} · <span>${lang==="en"?"Group":"Grupo"} ${t.group}</span></div>
      </div>
      <div class="team-stats">
        <div class="s"><span class="v">${t.cups>0?`<em>${t.cups}</em>`:"0"}</span><span class="k">${lang==="en"?"Titles":"Títulos"}</span></div>
        <div class="s"><span class="v">${t.finals}</span><span class="k">${lang==="en"?"Finals":"Finales"}</span></div>
        <div class="s"><span class="v">${t.wc}</span><span class="k">${lang==="en"?"WC played":"Mundiales"}</span></div>
      </div>
    </article>
  `;
  }).join("");

  $("#result-n").textContent = list.length;
  const tag = $("#result-tag");
  const sortTxt = filter.sort === "rank" ? (lang==="en"?"Sorted by FIFA ranking":"Ordenadas por ranking FIFA")
               : filter.sort === "az"   ? (lang==="en"?"Alphabetical order":"Orden alfabético")
               : (lang==="en"?"By number of titles":"Por cantidad de títulos");
  tag.textContent = sortTxt;
}

/* ── Groups bar (A–L) ── */
function renderGroups() {
  const lang = M26.getLang();
  const gb = $("#group-bar");
  const groups = [..."ABCDEFGHIJKL"];
  const all = `<button data-g="all" class="${filter.group==="all"?"active":""}">${lang==="en"?"All groups":"Todos los grupos"} <span class="n">${TEAMS.length}</span></button>`;
  const items = groups.map(g => {
    const n = TEAMS.filter(t => t.group === g).length;
    return `<button data-g="${g}" class="${filter.group===g?"active":""}">${lang==="en"?"Group":"Grupo"} ${g}<span class="n">${n}</span></button>`;
  }).join("");
  gb.innerHTML = all + items;
}

        </div>
        <div class="lb-historia" style="margin-top:24px;">
          <div class="lb-row"><span class="k">${lang==="en"?"First appearance":"Primer Mundial"}</span><span class="v">${t.wc>=15?"1930":t.wc>=10?"1950":t.wc>=5?"1970":"2000s"}</span></div>
          <div class="lb-row"><span class="k">${lang==="en"?"Best finish":"Mejor posición"}</span><span class="v">${t.cups>0?(lang==="en"?"Champion":"Campeón"):t.finals>0?(lang==="en"?"Runner-up":"Subcampeón"):t.wc>=5?(lang==="en"?"Quarter-finals":"Cuartos"):(lang==="en"?"Group stage":"Fase de grupos")}</span></div>
          <div class="lb-row"><span class="k">${lang==="en"?"Historic kit":"Uniforme histórico"}</span><span class="v" style="display:flex;align-items:center;gap:8px;">${teamName} <span style="display:inline-block;width:18px;height:18px;border-radius:4px;background:${t.c1};"></span></span></div>
        </div>
      </div>
      <div class="lb-section">
        <h4>${lang==="en"?"Key players":"Jugadores clave"}</h4>
        <div class="lb-keyplayers">
          ${t.keyP.map(p => {
            const [name, role] = p.split(" · ");
            const initials = name.split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase();
            return `<div class="lb-player">
              <div class="avatar">${initials}</div>
              <div class="info"><div class="nm">${name}</div><div class="rl">${role}</div></div>
            </div>`;
          }).join("")}
        </div>
      </div>
      <div class="lb-quote">
        "${t.quote}"
        <span class="cite">— ${t.manager}, ${lang==="en"?"Head coach":"Director técnico"}</span>
      </div>
    </div>
  `;
  $("#lightbox").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeLightbox() {
  $("#lightbox").classList.remove("open");
  document.body.style.overflow = "";
}

/* ── Events ── */
document.addEventListener("click", (e) => {
  // filter groups
  const fg = e.target.closest(".filter-group button, .sort-toggle button");
  if (fg) {
    const group = fg.closest("[data-filter]").dataset.filter;
    const val = fg.dataset.val;
    filter[group] = val;
    fg.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("active", b === fg));
    applyFilters();
    return;
  }
  // group chips
  const gc = e.target.closest("#group-bar button");
  if (gc) {
    filter.group = gc.dataset.g;
    $$("#group-bar button").forEach(b => b.classList.toggle("active", b === gc));
    applyFilters();
    return;
  }
  // team card
  const tc = e.target.closest(".team-card");
  if (tc) {
    openLightbox(+tc.dataset.idx);
    return;
  }
  if (e.target.id === "lb-close" || e.target.id === "lightbox") {
    closeLightbox();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeLightbox();
});
$("#search").addEventListener("input", (e) => {
  filter.q = e.target.value;
  applyFilters();
});
$("#search").setAttribute("placeholder", M26.getLang()==="en" ? "Search team…" : "Buscar selección…");

/* Re-render on lang change */
const origApply = M26.applyI18n;
M26.applyI18n = function() {
  origApply();
  $("#search").setAttribute("placeholder", M26.getLang()==="en" ? "Search team…" : "Buscar selección…");
  renderGroups();
  applyFilters();
};

renderGroups();
applyFilters();
</script>

<script>
// ── G: Parallax on hero ──
(function () {
  var h1 = document.querySelector('.page-hero h1');
  if (!h1) return;
  window.addEventListener('scroll', function () {
    h1.style.transform = 'translateY(' + window.scrollY * 0.10 + 'px)';
  }, { passive: true });
})();

// ── H: Magnetic 3D tilt on team cards ──
(function () {
  var TILT = 10, raf;
  function onEnter(e) {
    e.currentTarget.style.transition = 'transform 0.1s ease, border-color 0.25s, box-shadow 0.35s';
    e.currentTarget.style.willChange = 'transform';
  }
  function onMove(e) {
    var card = e.currentTarget, r = card.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width - 0.5;
    var y = (e.clientY - r.top)  / r.height - 0.5;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function () {
      card.style.transform = 'perspective(600px) rotateY(' + (x*TILT) + 'deg) rotateX(' + (-y*TILT) + 'deg) translateZ(6px) translateY(-3px)';
    });
  }
  function onLeave(e) {
    cancelAnimationFrame(raf);
    var card = e.currentTarget;
    card.style.transition = 'transform 0.5s cubic-bezier(0.22,1,0.36,1), border-color 0.25s, box-shadow 0.35s';
    card.style.transform = '';
    setTimeout(function () { card.style.willChange = ''; }, 500);
  }
  function attachTilt() {
    document.querySelectorAll('.team-card').forEach(function (c) {
      if (c.dataset.tilt) return;
      c.dataset.tilt = '1';
      c.addEventListener('mouseenter', onEnter);
      c.addEventListener('mousemove',  onMove);
      c.addEventListener('mouseleave', onLeave);
    });
  }
  setTimeout(attachTilt, 300);
  if (window.MutationObserver) {
    var t; new MutationObserver(function () { clearTimeout(t); t = setTimeout(attachTilt, 80); })
      .observe(document.getElementById('team-grid') || document.body, { childList: true, subtree: true });
  }
})();
</script>
</body>

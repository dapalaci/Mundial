<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIFA World Cup 2026™</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body { font-family: 'Barlow', sans-serif; background: #fff; overflow-x: hidden; }

    /* Scrollbar hide for player section */
    ::-webkit-scrollbar { width: 0; height: 0; }

    /* ---- Nav responsive ---- */
    @media (max-width: 768px) {
      .wc-nav-links { display: none !important; }
      .wc-mobile-toggle { display: flex !important; }
      .wc-hide-mobile { display: none !important; }
    }

    /* ---- Link hover ---- */
    .wc-nav-link { position: relative; }
    .wc-nav-link::after {
      content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 1.5px;
      background: currentColor; transition: width 0.3s ease;
    }
    .wc-nav-link:hover::after { width: 100%; }

    /* ---- Icon button hover ---- */
    .wc-icon-btn { transition: opacity 0.2s ease; }
    .wc-icon-btn:hover { opacity: 0.6; }

    /* ---- Scroll button hover ---- */
    .wc-scroll-btn:hover { background: rgba(128,128,128,0.1) !important; }

    /* ---- Hero CTA hover ---- */
    .wc-cta-hero:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.2); filter: brightness(1.1); }

    /* ---- Pill CTA hover ---- */
    .wc-pill-cta:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.15); }

    /* ---- Scroll reveal animations ---- */
    .wc-hero-content,
    .wc-section-title,
    .wc-card-wrapper,
    .wc-banner,
    .wc-newsletter {
      opacity: 0;
      transform: translateY(30px);
    }
    .wc-visible.wc-visible {
      opacity: 1;
      transform: translateY(0);
      animation: fadeSlideIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Card stagger */
    .wc-card-wrapper:nth-child(1) { animation-delay: 0ms; }
    .wc-card-wrapper:nth-child(2) { animation-delay: 120ms; }
    .wc-card-wrapper:nth-child(3) { animation-delay: 240ms; }

    /* ---- Modal entrance ---- */
    .wc-modal-content {
      animation: modalIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.92) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ---- Hero background Ken Burns animation ---- */
    .wc-hero-bg {
      animation: heroKenBurns 25s ease-in-out infinite alternate;
      will-change: transform;
    }
    @keyframes heroKenBurns {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.12) translateY(-2%); }
    }

    /* Hero flare pulse */
    .wc-hero-flare {
      animation: flarePulse 6s ease-in-out infinite alternate;
    }
    @keyframes flarePulse {
      0% { opacity: 0.4; transform: scaleY(1) rotate(-3deg); }
      100% { opacity: 0.8; transform: scaleY(1.15) rotate(3deg); }
    }

    /* ---- Scroll indicator bob ---- */
    .wc-scroll-indicator {
      animation: bob 2s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    /* ---- Player card hover shadow ---- */
    .wc-player-card:hover {
      box-shadow: 0 16px 48px rgba(0,0,0,0.18);
    }

    /* ---- Team page entrance ---- */
    .wc-team-page-enter {
      animation: teamPageIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes teamPageIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Back button hover */
    .wc-back-btn:hover {
      background: rgba(255,255,255,0.22) !important;
    }

    /* Player photo card hover */
    .wc-player-photo-card:hover {
      box-shadow: 0 16px 40px rgba(0,0,0,0.25);
    }

    /* ---- Gallery skeleton pulse ---- */
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.3; }
    }

    /* ---- Gallery card hover ---- */
    .wc-gallery-card:hover {
      box-shadow: 0 16px 40px rgba(0,0,0,0.2);
    }

    /* ---- Selection (input) ---- */
    input::placeholder { color: rgba(128,128,128,0.5); }
  </style>

  <!-- React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div id="root"></div>

<!-- Components -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="wc-ui.jsx"></script>
<script type="text/babel" src="wc-teams-carousel.jsx"></script>
<script type="text/babel" src="wc-team-page.jsx"></script>
<script type="text/babel" src="wc-venue-page.jsx"></script>
<script type="text/babel" src="wc-player-page.jsx"></script>
<script type="text/babel" src="wc-predictions.jsx"></script>
<script type="text/babel" src="wc-history-sections.jsx"></script>
<script type="text/babel" src="wc-balls-page.jsx"></script>
<script type="text/babel" src="wc-mascots-page.jsx"></script>
<script type="text/babel" src="wc-fanfest-page.jsx"></script>
<script type="text/babel" src="wc-scorers-page.jsx"></script>
<script type="text/babel" src="wc-history-page.jsx"></script>
<script type="text/babel" src="wc-finals-page.jsx"></script>
<script type="text/babel" src="wc-calendar-page.jsx"></script>
<script type="text/babel" src="wc-uniforms-page.jsx"></script>
<script type="text/babel" src="wc-chatbot.jsx"></script>

<!-- App -->
<script type="text/babel">
const { useState, useCallback } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#00C4B3",
  "darkMode": true,
  "roundedCards": true,
  "showCountdown": true
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [modalItem, setModalItem] = useState(null);
  const [searchOpen, setSearchOpen] = useState(false);
  const [activeTeam, setActiveTeam] = useState(null);
  const [activeVenue, setActiveVenue] = useState(null);
  const [activePlayer, setActivePlayer] = useState(null);
  const [activePage, setActivePage] = useState(null);

  const handleTeamClick = useCallback((item) => {
    setActiveTeam(item);
  }, []);
  const handleVenueClick = useCallback((item) => {
    if (VENUE_DETAILS && VENUE_DETAILS[item.id]) {
      setActiveVenue(item);
    }
  }, []);
  const closeModal = useCallback(() => setModalItem(null), []);
  const openSearch = useCallback(() => setSearchOpen(true), []);
  const closeSearch = useCallback(() => setSearchOpen(false), []);
  const handlePlayerClick = useCallback((player) => {
    if (PLAYER_DETAILS && PLAYER_DETAILS[player.name]) {
      setActivePlayer(player.name);
    }
  }, []);
  const handleHistoryNav = useCallback((pageId) => setActivePage(pageId), []);
  const goBackToLanding = useCallback(() => { setActiveTeam(null); setActiveVenue(null); setActivePlayer(null); setActivePage(null); }, []);

  // Detail pages for teams, venues, or players
  if (activeTeam || activeVenue || activePlayer || activePage) {
    return (
      <div style={{ background: tweaks.darkMode ? '#0A0A12' : '#fff', minHeight: '100vh', transition: 'background 0.4s ease' }}>
        <WCNav tweaks={tweaks} onSearchClick={openSearch} />
        {activeTeam && <WCTeamPage team={activeTeam} tweaks={tweaks} onBack={goBackToLanding} />}
        {activeVenue && <WCVenuePage venue={activeVenue} tweaks={tweaks} onBack={goBackToLanding} />}
        {activePlayer && <WCPlayerPage playerName={activePlayer} tweaks={tweaks} onBack={goBackToLanding} />}
        {activePage === 'balones' && <WCBallsPage tweaks={tweaks} onBack={goBackToLanding} />}
        {activePage === 'mascotas' && <WCMascotsPage tweaks={tweaks} onBack={goBackToLanding} />}
        {activePage === 'fanfest' && <WCFanFestPage tweaks={tweaks} onBack={goBackToLanding} />}
        {activePage === 'goleadores' && <WCScorersPage tweaks={tweaks} onBack={goBackToLanding} />}
        {activePage === 'historia' && <WCHistoryPage tweaks={tweaks} onBack={goBackToLanding} />}
        {activePage === 'finales' && <WCFinalsPage tweaks={tweaks} onBack={goBackToLanding} />}
        {activePage === 'calendario' && <WCCalendarPage tweaks={tweaks} onBack={goBackToLanding} />}
        {activePage === 'uniformes' && <WCUniformsPage tweaks={tweaks} onBack={goBackToLanding} />}
        <WCFooter tweaks={tweaks} />
        <WCSearchOverlay isOpen={searchOpen} onClose={closeSearch} />
        <WCChatbot tweaks={tweaks} />
        <TweaksPanel>
          <TweakSection label="Tema">
            <TweakToggle label="Modo Oscuro" value={tweaks.darkMode} onChange={v => setTweak('darkMode', v)} />
          </TweakSection>
          <TweakSection label="Color Principal">
            <TweakColor label="Acento" value={tweaks.accentColor}
              options={['#00C4B3', '#E8344E', '#F4A100', '#6C5CE7']}
              onChange={v => setTweak('accentColor', v)} />
          </TweakSection>
          <TweakSection label="Estilo">
            <TweakToggle label="Bordes Redondeados" value={tweaks.roundedCards} onChange={v => setTweak('roundedCards', v)} />
          </TweakSection>
        </TweaksPanel>
      </div>
    );
  }

  return (
    <div style={{ background: tweaks.darkMode ? '#0A0A12' : '#fff', minHeight: '100vh', transition: 'background 0.4s ease' }}>
      <WCNav tweaks={tweaks} onSearchClick={openSearch} />
      <WCHero tweaks={tweaks} onCalendarClick={() => setActivePage('calendario')} />
      <WCTeamsCarousel tweaks={tweaks} onTeamClick={handleTeamClick} />
      <WCBanner tweaks={tweaks} />
      <WCCardSection id="sedes" title="Sedes del Mundial" items={VENUES_DATA} tweaks={tweaks} onCardClick={handleVenueClick} />
      <WCPlayersSection tweaks={tweaks} onPlayerClick={handlePlayerClick} />
      <WCPredictions tweaks={tweaks} />
      <WCHistorySections tweaks={tweaks} onNavigate={handleHistoryNav} />
      <WCNewsletter tweaks={tweaks} />
      <WCFooter tweaks={tweaks} />

      <WCSearchOverlay isOpen={searchOpen} onClose={closeSearch} />
      <WCChatbot tweaks={tweaks} />

      <TweaksPanel>
        <TweakSection label="Tema">
          <TweakToggle label="Modo Oscuro" value={tweaks.darkMode} onChange={v => setTweak('darkMode', v)} />
        </TweakSection>
        <TweakSection label="Color Principal">
          <TweakColor label="Acento" value={tweaks.accentColor}
            options={['#00C4B3', '#E8344E', '#F4A100', '#6C5CE7']}
            onChange={v => setTweak('accentColor', v)} />
        </TweakSection>
        <TweakSection label="Estilo">
          <TweakToggle label="Bordes Redondeados" value={tweaks.roundedCards} onChange={v => setTweak('roundedCards', v)} />
          <TweakToggle label="Mostrar Countdown" value={tweaks.showCountdown} onChange={v => setTweak('showCountdown', v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
